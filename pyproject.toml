[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskqueue"
version = "0.1.0"
description = "A local Python task manager"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
deskqueue = "deskqueue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
